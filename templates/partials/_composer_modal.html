<div class="modal" data-modal="composer" hidden>
  <div class="modal__scrim" data-modal-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="composer-title">
    <header class="modal__head">
      <h2 id="composer-title">New post</h2>
      <button type="button" class="icon-btn" data-modal-close aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="modal__body">
      {% include 'partials/_composer.html' with variant='modal' %}
    </div>
  </div>
</div>
